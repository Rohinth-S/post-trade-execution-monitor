name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dashboard,test]'
      - run: python -m pytest -q
      - run: post_trade_execution_monitor --db reports/ci.sqlite3 --seed-demo --output reports/ci.json
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait
      - run: curl --fail --retry 10 --retry-connrefused http://127.0.0.1:8501/_stcore/health
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
